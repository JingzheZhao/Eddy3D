name: Template Branch Warning

on:
  push:
    branches:
      - main
      - dev
      - release
  pull_request:
    branches:
      - main
      - dev
      - release
  workflow_dispatch:

jobs:
  template-branch-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read expected template branch
        id: expected_branch
        shell: pwsh
        run: |
          $content = Get-Content 'EddyLib/GlobalSettings/EddyVersion.cs' -Raw
          $match = [regex]::Match($content, 'ProductVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw 'Could not read EddyVersion.ProductVersion from EddyLib/GlobalSettings/EddyVersion.cs'
          }

          $branch = $match.Groups[1].Value
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check template branch and root contents (warning only)
        id: template_check
        continue-on-error: true
        shell: pwsh
        run: |
          $owner = "Eddy3D-Dev"
          $repo = "Eddy3D-OutdoorIndoorTemplates"
          $branch = "${{ steps.expected_branch.outputs.branch }}"

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "eddy3d-template-branch-check"
          }

          $branchUrl = "https://api.github.com/repos/$owner/$repo/branches/$branch"
          try {
            Invoke-RestMethod -Uri $branchUrl -Headers $headers -Method Get | Out-Null
          } catch {
            throw "Template branch '$branch' does not exist in $owner/$repo."
          }

          $contentsUrl = "https://api.github.com/repos/$owner/$repo/contents?ref=$branch"
          try {
            $contents = Invoke-RestMethod -Uri $contentsUrl -Headers $headers -Method Get
          } catch {
            throw "Failed to read root contents of branch '$branch' in $owner/$repo."
          }

          if ($null -eq $contents -or (@($contents).Count -lt 1)) {
            throw "Template branch '$branch' exists but is empty in $owner/$repo."
          }

      - name: Warn when template branch check fails
        if: steps.template_check.outcome == 'failure'
        run: |
          echo "::warning::Template branch check failed. Expected branch '${{ steps.expected_branch.outputs.branch }}' in Eddy3D-OutdoorIndoorTemplates to exist and be non-empty."

      - name: Success note
        if: steps.template_check.outcome == 'success'
        run: echo "Template branch check passed."
