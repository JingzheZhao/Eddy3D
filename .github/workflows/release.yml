name: Release On Release Branch

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Restore
        run: dotnet restore Eddy.sln

      - name: Build Release
        run: dotnet build Eddy.sln -c Release --no-restore

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content 'EddyLib/GlobalSettings/EddyVersion.cs' -Raw
          $match = [regex]::Match($content, 'ProductVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw 'Could not read EddyVersion.ProductVersion from EddyLib/GlobalSettings/EddyVersion.cs'
          }

          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Collect Release Assets
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pluginDir = 'Eddy/bin/Release/net8.0-windows'
          $installer = "Build/$version/Eddy3D.exe"
          $assetDir = Join-Path $env:RUNNER_TEMP 'eddy-release-assets'

          if (-not (Test-Path $pluginDir)) {
            throw "Plugin output folder not found: $pluginDir"
          }

          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          Copy-Item "$pluginDir/Eddy.gha" $assetDir -Force
          Copy-Item "$pluginDir/Eddy.dll" $assetDir -Force
          Copy-Item "$pluginDir/EddyLib.dll" $assetDir -Force

          $zipPath = Join-Path $assetDir "Eddy3D-$version-plugin.zip"
          Compress-Archive -Path "$pluginDir/*" -DestinationPath $zipPath -Force

          Copy-Item $installer (Join-Path $assetDir "Eddy3D-$version-setup.exe") -Force

          "asset_dir=$assetDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check If Release Exists
        id: release_check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release for ${tag} already exists. Skipping release creation.`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eddy3D ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.asset_dir }}/*.exe
            ${{ steps.assets.outputs.asset_dir }}/*.zip
            ${{ steps.assets.outputs.asset_dir }}/*.dll
            ${{ steps.assets.outputs.asset_dir }}/*.gha

      - name: Skip Existing Release
        if: steps.release_check.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.tag }} already exists. Build completed, no new release created."
