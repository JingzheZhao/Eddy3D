name: Release On Release Branch

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Restore
        run: dotnet restore Eddy.sln

      - name: Build Release
        run: dotnet build Eddy.sln -c Release --no-restore

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content 'EddyLib/GlobalSettings/EddyVersion.cs' -Raw
          $match = [regex]::Match($content, 'ProductVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw 'Could not read EddyVersion.ProductVersion from EddyLib/GlobalSettings/EddyVersion.cs'
          }

          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Collect Release Assets
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "Build/$version/Eddy3D.exe"
          $assetDir = Join-Path $env:RUNNER_TEMP 'eddy-release-assets'

          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          Copy-Item $installer (Join-Path $assetDir "Eddy3D-$version-setup.exe") -Force

          "asset_dir=$assetDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check If Tag Exists
        id: tag_check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists. Skipping release creation.`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eddy3D ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.asset_dir }}/Eddy3D-${{ steps.version.outputs.version }}-setup.exe

      - name: Skip Existing Release
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists. Build completed, no new release created."
